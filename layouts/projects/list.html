{{ define "main" }}
<div class="landing-page">
  <h1 style="text-align:center; margin-bottom:40px;">projects</h1>
  <div class="card-grid">
    {{ range .Pages }}
    <a href="{{ .Permalink }}" class="card">
      {{ if .Params.thumbnail }}
      <img src="{{ .Params.thumbnail }}" alt="{{ .Title }}">
      {{ end }}
      <div class="card-body">
        <h2>{{ .Title }}</h2>
        <p class="card-date">{{ .Date.Format "January 2, 2006" }}</p>
      </div>
    </a>
    {{ end }}
  </div>
</div>

<style>
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; padding: 0 20px; }
.card { background: #2a2740; border-radius: 16px; overflow: hidden; text-decoration: none; color: inherit; transition: transform 0.2s; display: block; }
.card:hover { transform: translateY(-4px); }
.card img { width: 100%; height: 180px; object-fit: cover; }
.card-body { padding: 16px; }
.card-body h2 { font-size: 18px; margin: 0 0 8px; color: #f2c4ee; }
.card-date { font-size: 13px; color: #888; margin: 0; }
</style>
{{ end }}
